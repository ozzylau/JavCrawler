services:
  javcrawler:
    build: .
    image: javcrawler:latest
    container_name: javcrawler
    network_mode: host
    environment:
      - TZ=Asia/Shanghai     # 定时任务按本地时间触发
    volumes:
      - /mnt/data:/mnt/data
      - ./config.json:/app/config.json
      - ./data:/app/data        # 刮削状态 + 按日期历史日志
    restart: unless-stopped
